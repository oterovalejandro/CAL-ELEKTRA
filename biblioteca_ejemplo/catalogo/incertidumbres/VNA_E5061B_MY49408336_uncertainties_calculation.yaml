document_control:
  title: Keysight E5061B VNA Uncertainty Data File
  document_id: VNA-E5061B-MY49408336-UNC-08-2026
  revision: 1.0.0
  created_date: '2026-08-06'
  created_by: ALTER TECHNOLOGY CAL EC-LB
  last_modified_date: '2026-08-06'
  comments:
  - File generated from Keysight E5061B datasheet 5990-4392EN and calibration certificate LE1773.000 / 5011865A010.
  - Only maximum manufacturer datasheet values are used; typical and SPD values are excluded from uncertainty_sources unless
    explicitly marked as performance-only metadata.
  - Frequency ranges are stored in Hz to avoid ambiguity.
  - Expanded uncertainties from the calibration certificate use k=2 unless otherwise stated.
  - Graphical calibration results in the certificate are recorded as PASS / not digitized unless numerical values are tabulated.
  - Transmission and reflection uncertainty curves in the datasheet are graphical. The YAML stores conservative maximum digitized/envelope
    values from the declared specification plots and flags them as graphical_envelope.
