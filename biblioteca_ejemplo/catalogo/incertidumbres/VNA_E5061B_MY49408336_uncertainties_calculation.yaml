python_parser_contract:
  minimum_required_keys_per_uncertainty_source:
  - source_id
  - source_type
  - quantity
  - applicable_to
  - unit
  - uncertainty_type
  - coverage_factor
  - frequency_ranges
  - include_in_total
  recommended_algorithm:
  - Load YAML file.
  - Filter uncertainty_sources by parameter, quantity, port and frequency.
  - Select the matching frequency range and operating level/reflection coefficient range where applicable.
  - 'Extract the field according to unit_family: magnitude_db, phase_deg, magnitude_linear, magnitude_db_per_k, phase_deg_per_k
    or uncertainty_hz.'
  - Convert expanded uncertainty to standard uncertainty using u = U/k.
  - Use RMS entries directly as standard deviation unless the calculation policy requires scaling.
  - For temperature coefficients, multiply by absolute temperature deviation and divide by sqrt(3) for rectangular distribution.
  - Combine independent components by RSS.
  - Expand combined standard uncertainty using requested k.
  field_selection_notes:
    transmission_magnitude_uncertainty: Use magnitude_db in matching range.
    transmission_phase_uncertainty: Use phase_deg in matching range.
    reflection_linear_magnitude_uncertainty: Use magnitude_linear in matching level range.
    reflection_phase_uncertainty: Use phase_deg in matching level range.
    trace_noise_magnitude_rms: Use magnitude_db when IF bandwidth is equal to or greater than the specified/datasheet condition,
      according to engine policy.
    trace_noise_phase_rms: Use phase_deg when IF bandwidth is equal to or greater than the specified/datasheet condition,
      according to engine policy.
    receiver_dynamic_accuracy_magnitude: Use magnitude_db and interpolate by input power if enabled.
    receiver_dynamic_accuracy_phase: Use phase_deg and interpolate by input power if enabled.
