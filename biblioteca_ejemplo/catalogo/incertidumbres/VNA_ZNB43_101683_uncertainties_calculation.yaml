python_parser_contract:
  minimum_required_keys_per_uncertainty_source:
  - source_id
  - source_type
  - quantity
  - applicable_to
  - unit
  - uncertainty_type
  - coverage_factor
  - frequency_ranges
  - include_in_total
  recommended_algorithm:
  - Load YAML file.
  - Filter uncertainty_sources by parameter, quantity, port and frequency.
  - Select the matching frequency range and operating level/reflection range where applicable.
  - Extract the correct field according to quantity, e.g. magnitude_db, phase_deg, linear_magnitude, uncertainty_hz.
  - Convert expanded uncertainty to standard uncertainty using u = U/k.
  - If treating limits with rectangular distribution, use u = a/sqrt(3).
  - Apply sensitivity coefficient.
  - Combine independent components by RSS.
  - Expand combined standard uncertainty using requested k.
  field_selection_notes:
    transmission_magnitude_uncertainty: Use magnitude_db in matching range.
    transmission_phase_uncertainty: Use phase_deg in matching range.
    reflection_log_magnitude_uncertainty: Use log_magnitude_db at matching reflection_level_db.
    reflection_phase_uncertainty: Use phase_deg at matching reflection_level_db.
    reflection_linear_magnitude_uncertainty: Use linear_magnitude for matching linear_range_db.
    trace_noise_magnitude_rms: Use spec_max_db_rms, typical_db_rms or measured_db_rms according to selected policy.
    trace_noise_phase_rms: Use spec_max_deg_rms, typical_deg_rms or measured_deg_rms according to selected policy.