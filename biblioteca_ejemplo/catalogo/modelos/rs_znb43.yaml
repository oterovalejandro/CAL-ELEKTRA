# R&S ZNB43, 2 puertos, 100 kHz – 43,5 GHz.
# Driver: adaptador sobre los comandos del driver RsZnx de R&S
# (src/calelektra/instruments/rs_znx.py). La incertidumbre de cada unidad está
# en su fichero de incertidumbres (campo «incertidumbre» del equipo).
formato: calelektra/modelo@0.3
id: rs_znb43
categoria: vna
fabricante: Rohde & Schwarz
modelo: ZNB43
variante: 2 puertos
campos:
  rango_frecuencia: [100 kHz, 43.5 GHz]
  num_puertos: 2
  conector_puertos: { familia: NMD 2.92 mm, genero: macho }   # 2,92 mm NMD macho (fichero de incertidumbres del nº 101683)
  impedancia_ref_ohm: 50
  potencia_salida_dbm: [-40, 0]                             # A CONFIRMAR
  ifbw: [1 Hz, 10 MHz]
  puntos_max: 100001
  metodos_calibracion: [OSM, TOSM, UOSM, TRL, TNA, autocal, normalizacion]
comunicacion:
  driver: rs_znx
  transportes:
    - { tipo: visa, recurso: "TCPIP::{host}::hislip0::INSTR", preferido: true }
    - { tipo: visa, recurso: "TCPIP::{host}::inst0::INSTR" }
documentos:
  - { tipo: datasheet, referencia: "R&S ZNB Vector Network Analyzer Specifications 3608.3278.22 v07.00 (2023-12)" }
  - { tipo: driver, referencia: "R&S RsZnx IVI.NET driver 4.25.0" }
