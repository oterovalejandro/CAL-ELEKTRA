# R&S ZNB43, 2 puertos, 100 kHz – 43,5 GHz.
# Parámetros a verificar con el datasheet. El driver real (comandos del
# fabricante) se integrará más adelante; mientras, el equipo VNA-01 se marca
# como "simulado" y el software usa el VNA dummy con estos parámetros.
formato: calelektra/modelo@0.2
id: rs_znb43
categoria: vna
fabricante: Rohde & Schwarz
modelo: ZNB43
variante: 2 puertos
parametros:
  rango_frecuencia: [100 kHz, 43.5 GHz]
  num_puertos: 2
  conector_puertos: { familia: "2.92 mm", genero: macho }   # A CONFIRMAR
  impedancia_ref: 50
  potencia_salida_dbm: [-40, 0]                             # A CONFIRMAR
  ifbw: { rango: [1 Hz, 10 MHz], secuencia: [1, 1.5, 2, 3, 5, 7] }
  puntos_max: 100001
comunicacion:
  driver: rs_znb            # adaptador sobre los comandos del fabricante (pendiente)
  transportes:
    - { tipo: visa, recurso: "TCPIP::{host}::hislip0::INSTR", preferido: true }
    - { tipo: visa, recurso: "TCPIP::{host}::inst0::INSTR" }
especificaciones:
  - fichero: ../especificaciones/rs_znb43_EJEMPLO.yaml
documentos:
  - { tipo: datasheet, referencia: "R&S ZNB – Specifications (indicar versión)" }
  - { tipo: manual, referencia: "R&S ZNB/ZNBT – User Manual (indicar versión de firmware)" }
