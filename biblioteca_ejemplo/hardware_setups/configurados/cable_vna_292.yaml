# calibración será UOSM (through desconocido).
formato: calelektra/setup@0.4
id: cable_vna_292
nombre: Cables 2,92 mm — solo VNA (ZNB43)
plantilla: camino_rf_2p_s
rango_requerido: [50 MHz, 40 GHz]
frecuencias:
  modo: lineal
  definicion: paso
  paso: 50 MHz               # → 800 puntos
caminos:
  P1: []
  P2: []
asignaciones:
  vna: VNA-01
  kit_cal: KIT-292-01
