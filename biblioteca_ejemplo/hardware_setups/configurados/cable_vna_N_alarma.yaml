# Ejemplo con ALARMA de conectores: sin cables en los caminos los planos son los
# puertos 2,92 mm macho del ZNB43 y el kit N no sirve para ellos. Un cable N
# (p. ej. CAB-DUT-0001, N macho–macho) tampoco se podría conectar: la
# comprobación de la plantilla de ensayo lo indica. Para cables N, use un setup
# con cables de medida N en los caminos (cable_N_18G).
formato: calelektra/setup@0.4
id: cable_vna_N_alarma
nombre: Cable N directo al ZNB43 (ejemplo con alarma)
plantilla: camino_rf_2p_s
rango_requerido: [100 kHz, 18 GHz]
frecuencias:
  modo: lineal
  puntos: 801
caminos:
  P1: []
  P2: []
asignaciones:
  vna: VNA-01
  kit_cal: KIT-N-01
