# Ejemplo con ALARMA de conectores: el kit N no sirve para los planos 2,92 mm
# macho del ZNB43. Una plantilla de ensayo con un cable N (p. ej. CAB-DUT-0001,
# N macho–macho) tampoco se podría conectar a esos puertos: su comprobación lo
# indica. Para cables N use el setup «componente_2p» con cables de medida N.
formato: calelektra/setup@0.3
id: cable_vna_N_alarma
nombre: Cable N directo al ZNB43 (ejemplo con alarma)
plantilla: cable_vna
rango_requerido: [100 kHz, 18 GHz]
frecuencias:
  modo: lineal
  puntos: 801
asignaciones:
  vna: VNA-01
  kit_cal: KIT-N-01
