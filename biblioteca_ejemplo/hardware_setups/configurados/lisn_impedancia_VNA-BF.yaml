# Impedancia en el terminal EUT de una LISN con el VNA de baja frecuencia
# (cubre desde 9 kHz). El camino de P1 es el cable de medida N y el adaptador
# N – terminales de la LISN: el plano de referencia (calibración OSM) queda en
# los terminales del adaptador. La LISN a calibrar (EUT) la define la plantilla
# de ensayo.
formato: calelektra/setup@0.4
id: lisn_impedancia_VNA-BF
nombre: Impedancia LISN con VNA de baja frecuencia
plantilla: impedancia_1p
rango_requerido: [9 kHz, 30 MHz]
frecuencias:
  modo: logaritmico
  puntos: 201
caminos:
  P1: [CAB-PT-BF-01, ADP-LISN-01]
asignaciones:
  vna: VNA-BF-01
  kit_cal: KIT-N-01
