# Hardware setup SENCILLO de calibración de cables de RF: solo el VNA.
# El cable (DUT) se conecta directamente a los puertos del VNA, que son los
# planos de referencia. La calibración se decide con los conectores (campos):
#   - si los planos se pueden unir (macho con hembra): TOSM con through plano;
#   - si no (p. ej. dos puertos macho): UOSM con un through desconocido
#     (un adaptador hembra-hembra o el propio cable).
formato: calelektra/plantilla_setup@0.3
id: cable_vna
nombre: Cable de RF — solo VNA (parámetros S → .s2p)
version: "1.0"
estado: borrador
descripcion: >
  Calibración de los dos puertos del VNA en sus propios conectores, medida de
  los cuatro parámetros S del cable y exportación a Touchstone (.s2p) en el
  rango requerido.
roles:
  vna:
    categoria: vna
    etiqueta: VNA
  kit_cal:
    categoria: kit_calibracion
    etiqueta: Kit de calibración
    cardinalidad: "0..1"
    descripcion: Opcional. Sin kit asignado se usa el kit seleccionado en el VNA (no queda registrado).
  dut:
    categoria: [cable, cable_medida, adaptador, path]
    etiqueta: Cable a calibrar (DUT)
    es_dut: true
    requiere_datos_s: false
planos_referencia:
  PR1: { en: [vna.P1], puerto_vna: 1 }
  PR2: { en: [vna.P2], puerto_vna: 2 }
calibracion_vna:
  metodos: [TOSM, UOSM]
  kit: kit_cal
requisitos:
  - id: vna_puertos
    campo: vna.num_puertos
    operador: ">="
    valor: 2
    mensaje: El VNA debe tener al menos 2 puertos de medida
  - id: vna_metodos
    campo: vna.metodos_calibracion
    operador: contiene_alguno
    valor: [TOSM, UOSM]
    mensaje: El VNA debe poder calibrar 2 puertos (TOSM o UOSM)
  - id: dut_longitud
    campo: dut.longitud_m
    operador: existe
    gravedad: aviso
    mensaje: Indique la longitud del cable (se registra en el certificado y ayuda a revisar el retardo)
estados_conexion:
  calibracion:
    descripcion: Estándares del kit en los puertos P1 y P2 del VNA (planos PR1 y PR2)
    conexiones: []
  medida:
    descripcion: Cable conectado entre P1 (extremo A) y P2 (extremo B)
    conexiones:
      - [vna.P1, dut.A]
      - [dut.B, vna.P2]
