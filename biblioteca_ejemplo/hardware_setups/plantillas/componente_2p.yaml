# Hardware setup genérico: componente de 2 puertos con VNA, cables de medida y
# adaptadores (cables, atenuadores, adaptadores, paths…). Declara ROLES; los
# equipos se asignan al configurarlo.
formato: calelektra/plantilla_setup@0.3
id: componente_2p
nombre: Componente de 2 puertos (cable) — VNA con cables de medida
version: "0.3"
estado: borrador
descripcion: >
  El DUT se inserta entre los planos de referencia PR1 y PR2, en los extremos
  de los cables de medida (o de los adaptadores, si los hay).
roles:
  vna:
    categoria: vna
    etiqueta: VNA
  cable_p1:
    categoria: cable_medida
    etiqueta: Cable de medida P1
  cable_p2:
    categoria: cable_medida
    etiqueta: Cable de medida P2
  adaptador_p1:
    categoria: adaptador
    etiqueta: Adaptador P1
    cardinalidad: "0..1"
    tipos: [coaxial]
  adaptador_p2:
    categoria: adaptador
    etiqueta: Adaptador P2
    cardinalidad: "0..1"
    tipos: [coaxial]
  kit_cal:
    categoria: kit_calibracion
    etiqueta: Kit de calibración
  dut:
    categoria: [cable, adaptador, path, cable_medida]
    etiqueta: DUT
    es_dut: true
    requiere_datos_s: false
planos_referencia:
  PR1: { en: [adaptador_p1.B, cable_p1.B], puerto_vna: 1 }
  PR2: { en: [adaptador_p2.B, cable_p2.B], puerto_vna: 2 }
calibracion_vna:
  metodos: [TOSM, UOSM]
  kit: kit_cal
requisitos:
  - id: vna_puertos
    campo: vna.num_puertos
    operador: ">="
    valor: 2
    mensaje: El VNA debe tener al menos 2 puertos de medida
  - id: vna_metodos
    campo: vna.metodos_calibracion
    operador: contiene_alguno
    valor: [TOSM, UOSM]
    mensaje: El VNA debe poder calibrar 2 puertos (TOSM o UOSM)
  - id: cable_p1_fase
    campo: cable_p1.estable_en_fase
    operador: "=="
    valor: true
    gravedad: aviso
    mensaje: Los cables de medida deben ser estables en fase
  - id: cable_p2_fase
    campo: cable_p2.estable_en_fase
    operador: "=="
    valor: true
    gravedad: aviso
    mensaje: Los cables de medida deben ser estables en fase
estados_conexion:
  calibracion:
    descripcion: Estándares del kit conectados en PR1 y PR2
    conexiones:
      - [vna.P1, cable_p1.A]
      - [cable_p1.B, adaptador_p1.A]
      - [vna.P2, cable_p2.A]
      - [cable_p2.B, adaptador_p2.A]
  medida:
    descripcion: DUT insertado entre PR1 y PR2
    conexiones:
      - [vna.P1, cable_p1.A]
      - [cable_p1.B, adaptador_p1.A]
      - [adaptador_p1.B, dut.A]
      - [dut.B, adaptador_p2.B]
      - [adaptador_p2.A, cable_p2.B]
      - [cable_p2.A, vna.P2]
