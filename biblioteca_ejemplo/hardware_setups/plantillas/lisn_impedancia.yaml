# Especialización de reflexion_1p para la impedancia de LISN/AMN (CISPR 16-1-2).
# Hereda roles, requisitos y estados; aquí solo se redefine o añade lo que cambia.
# La calibración OSM se hace en el conector N del cable de medida (PR1); el
# adaptador N–terminales de la LISN queda después del plano de referencia.
formato: calelektra/plantilla_setup@0.3
id: lisn_impedancia
extiende: reflexion_1p
nombre: Impedancia de LISN/AMN — VNA 1 puerto
version: "0.3"
estado: borrador
rango_medida: [9 kHz, 30 MHz]
roles:
  dut:
    categoria: lisn
    etiqueta: LISN
  adaptador_p1:
    etiqueta: Adaptador de medida LISN
    cardinalidad: "1"
    tipos: [lisn]
  carga_receptor:
    categoria: carga
    etiqueta: Carga 50 Ω (puerto receptor)
    tipos: [carga_50]
planos_referencia:
  PR1: { en: [cable_p1.B], puerto_vna: 1 }
requisitos:
  - id: lisn_red
    campo: dut.red_nominal
    operador: existe
    mensaje: La LISN debe indicar su red nominal (impedancia de referencia de la verificación)
  - id: lisn_lineas
    campo: dut.lineas
    operador: existe
    mensaje: Indique las líneas de la LISN que se miden
  - id: carga_50
    campo: carga_receptor.impedancia_ohm
    operador: "=="
    valor: 50
    mensaje: El puerto receptor de la LISN se termina en 50 Ω
ejes:
  linea:
    descripcion: Línea de la LISN bajo medida (L1, N, …)
    actuador: dut          # remoto si la LISN lo permite; si no, manual con confirmación
estados_conexion:
  calibracion:
    descripcion: Estándares Open / Short / Match en el extremo del cable de medida (PR1)
    conexiones:
      - [vna.P1, cable_p1.A]
  medida:
    descripcion: Adaptador en el terminal EUT de la línea medida; puerto receptor en 50 Ω
    conexiones:
      - [vna.P1, cable_p1.A]
      - [cable_p1.B, adaptador_p1.A]
      - [adaptador_p1.B, dut.EUT]
      - [dut.RX, carga_receptor.P]
