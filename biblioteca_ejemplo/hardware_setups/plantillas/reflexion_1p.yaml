# Hardware setup genérico: reflexión en 1 puerto con VNA (impedancia, RL, VSWR).
formato: calelektra/plantilla_setup@0.3
id: reflexion_1p
nombre: Reflexión en 1 puerto — VNA
version: "0.3"
estado: borrador
roles:
  vna:
    categoria: vna
    etiqueta: VNA
  cable_p1:
    categoria: cable_medida
    etiqueta: Cable de medida P1
  adaptador_p1:
    categoria: adaptador
    etiqueta: Adaptador P1
    cardinalidad: "0..1"
  kit_cal:
    categoria: kit_calibracion
    etiqueta: Kit de calibración
  dut:
    categoria: [antena, carga, cable, lisn]
    etiqueta: DUT
    es_dut: true
planos_referencia:
  PR1: { en: [adaptador_p1.B, cable_p1.B], puerto_vna: 1 }
calibracion_vna:
  metodos: [OSM]
  kit: kit_cal
requisitos:
  - id: vna_puertos
    campo: vna.num_puertos
    operador: ">="
    valor: 1
  - id: vna_osm
    campo: vna.metodos_calibracion
    operador: contiene
    valor: OSM
    mensaje: El VNA debe poder calibrar OSM en un puerto
estados_conexion:
  calibracion:
    descripcion: Estándares Open / Short / Match en PR1
    conexiones:
      - [vna.P1, cable_p1.A]
      - [cable_p1.B, adaptador_p1.A]
  medida:
    conexiones:
      - [vna.P1, cable_p1.A]
      - [cable_p1.B, adaptador_p1.A]
      - [adaptador_p1.B, dut.A]
