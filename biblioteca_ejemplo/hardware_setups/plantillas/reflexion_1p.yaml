# Hardware setup genérico: reflexión en 1 puerto con VNA (impedancia, RL, VSWR).
formato: calelektra/plantilla_setup@0.2
id: reflexion_1p
nombre: Reflexión en 1 puerto — VNA
version: 0.2
estado: borrador
roles:
  vna:
    categoria: vna
    etiqueta: VNA
    puertos_min: 1
  cable_p1:
    categoria: cable_medida
    etiqueta: Cable de medida P1
  adaptador_p1:
    categoria: adaptador
    etiqueta: Adaptador P1
    cardinalidad: "0..1"
  kit_cal:
    categoria: kit_calibracion
    etiqueta: Kit de calibración
  dut:
    categoria: [antena, carga, cable, lisn]
    etiqueta: DUT
    es_dut: true
planos_referencia:
  PR1: { en: [adaptador_p1.B, cable_p1.B] }
calibracion_vna:
  metodos: [OSM, autocal]
  kit: kit_cal
estados_conexion:
  medida:
    conexiones:
      - [vna.P1, cable_p1.A]
      - [cable_p1.B, adaptador_p1.A]
      - [adaptador_p1.B, dut.A]
  calibracion:
    descripcion: Estándares Open / Short / Match en PR1
    conexiones:
      - [vna.P1, cable_p1.A]
      - [cable_p1.B, adaptador_p1.A]
