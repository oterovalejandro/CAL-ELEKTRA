# Cámara semianecoica — NSA, CISPR 16-1-4 método clásico con factores de
# antena, siempre con VNA. Camino P1 (transmisión): cables / path hasta la antena
# emisora; camino P2 (recepción): antena receptora, path, preamplificador… hasta
# el VNA. Cada camino termina en su antena (por segmento de frecuencia, p. ej.
# bicónicas y log-periódicas); el plano de referencia queda en el conector de la
# antena, donde se une el through de la normalización (V_DIRECTA). Alturas y
# posiciones las fija la ejecución, no el setup. (Sin algoritmo de ensayo todavía.)
formato: calelektra/plantilla_setup@0.4
id: sac_nsa
nombre: SAC — NSA (método clásico) — VNA
version: "0.4"
estado: borrador
rango_medida: [30 MHz, 1 GHz]
algoritmos: []
caminos:
  P1:
    etiqueta: Camino TX
    categorias: [cable_medida, path, adaptador, preamplificador]
    sentido: tx
    final: antena_tx
  P2:
    etiqueta: Camino RX
    categorias: [cable_medida, path, adaptador, preamplificador]
    sentido: rx
    final: antena_rx
roles:
  recinto:
    categoria: recinto
    etiqueta: Recinto
    es_dut: true
  vna:
    categoria: vna
    etiqueta: VNA
  adaptador_through:
    categoria: adaptador
    etiqueta: Through de normalización
    cardinalidad: "0..1"
    tipos: [through, coaxial]
  antena_tx:
    categoria: antena
    etiqueta: Antena TX
    por_segmento: true
    tipos: [biconica, log_periodica, hibrida]
    montado_en: soporte_tx
  antena_rx:
    categoria: antena
    etiqueta: Antena RX
    por_segmento: true
    tipos: [biconica, log_periodica, hibrida]
    montado_en: soporte_rx
  soporte_tx:
    categoria: posicionador
    etiqueta: Mástil / trípode TX
  soporte_rx:
    categoria: posicionador
    etiqueta: Mástil RX
ejes:
  altura_tx:    { actuador: soporte_tx }
  polarizacion_tx: { actuador: soporte_tx }
  altura_rx:    { actuador: soporte_rx }
  polarizacion_rx: { actuador: soporte_rx }
  posicion:     { actuador: manual, descripcion: Posición de la antena TX en el volumen de ensayo }
calibracion_vna:
  metodos: [normalizacion]
  through: adaptador_through
requisitos:
  - id: vna_puertos
    campo: vna.num_puertos
    operador: ">="
    valor: 2
  - id: recinto_tipo
    campo: recinto.tipo
    operador: en
    valor: [SAC, OATS]
    mensaje: La NSA (método clásico) se aplica a SAC u OATS
  - id: recinto_distancia
    campo: recinto.distancia_medida_m
    operador: en
    valor: [3, 10, 30]
    gravedad: aviso
    mensaje: Distancias normalizadas de CISPR 16-1-4 (3, 10 o 30 m)
  - id: antena_tx_polarizacion
    campo: antena_tx.polarizaciones
    operador: contiene
    valor: [H, V]
    mensaje: La NSA se mide en polarización horizontal y vertical
  - id: antena_rx_polarizacion
    campo: antena_rx.polarizaciones
    operador: contiene
    valor: [H, V]
    mensaje: La NSA se mide en polarización horizontal y vertical
  - id: mastil_rx
    campo: soporte_rx.motorizado
    operador: "=="
    valor: true
    gravedad: aviso
    mensaje: La altura de la antena receptora se barre durante la NSA; con un soporte manual se pedirá cada altura al operador
estados_conexion:
  medida:
    descripcion: Antenas al final de los caminos, montadas en sus soportes
    conexiones:
      - [P1, antena_tx.RF]
      - { entre: [antena_tx.RF, antena_rx.RF], tipo: radiado }
      - [antena_rx.RF, P2]
  normalizacion:
    descripcion: Antenas desconectadas; caminos unidos con el through (V_DIRECTA)
    conexiones:
      - [P1, adaptador_through.A]
      - [adaptador_through.B, P2]
