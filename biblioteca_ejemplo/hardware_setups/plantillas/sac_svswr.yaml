# Cámara semianecoica — S_VSWR, CISPR 16-1-4 método estándar de 6 posiciones,
# con VNA. Camino P1 (transmisión) hasta la antena omnidireccional y camino P2
# (recepción) desde la bocina, con preamplificador si hace falta. Las
# posiciones y alturas las fija la ejecución, no el setup. (Sin algoritmo de
# ensayo todavía.)
formato: calelektra/plantilla_setup@0.4
id: sac_svswr
nombre: SAC — S_VSWR (6 posiciones) — VNA
version: "0.4"
estado: borrador
rango_medida: [1 GHz, 18 GHz]
algoritmos: []
caminos:
  P1:
    etiqueta: Camino TX
    categorias: [cable_medida, path, adaptador, preamplificador]
    sentido: tx
    final: antena_tx
  P2:
    etiqueta: Camino RX
    categorias: [cable_medida, path, adaptador, preamplificador]
    sentido: rx
    final: antena_rx
roles:
  recinto:
    categoria: recinto
    etiqueta: Recinto
    es_dut: true
  vna:
    categoria: vna
    etiqueta: VNA
  antena_tx:
    categoria: antena
    etiqueta: Antena TX (omnidireccional)
    tipos: [omnidireccional_svswr]
    montado_en: soporte_tx
  antena_rx:
    categoria: antena
    etiqueta: Antena RX (bocina)
    tipos: [bocina]
    montado_en: soporte_rx
  soporte_tx:
    categoria: posicionador
    etiqueta: Mástil / trípode TX
  soporte_rx:
    categoria: posicionador
    etiqueta: Mástil RX
ejes:
  desplazamiento_tx: { actuador: soporte_tx, descripcion: "6 posiciones hacia la antena RX" }
  altura_tx:         { actuador: soporte_tx }
  polarizacion_tx:   { actuador: soporte_tx }
  altura_rx:         { actuador: soporte_rx }
  polarizacion_rx:   { actuador: soporte_rx }
  posicion:          { actuador: manual }
calibracion_vna:
  metodos: [ninguna_obligatoria]
requisitos:
  - id: vna_puertos
    campo: vna.num_puertos
    operador: ">="
    valor: 2
  - id: recinto_tipo
    campo: recinto.tipo
    operador: en
    valor: [SAC, FAR]
    mensaje: El S_VSWR se aplica a SAC o FAR por encima de 1 GHz
  - id: antena_rx_polarizacion
    campo: antena_rx.polarizaciones
    operador: contiene
    valor: [H, V]
    mensaje: El S_VSWR se mide en las dos polarizaciones
estados_conexion:
  medida:
    descripcion: Antenas al final de los caminos, montadas en sus soportes
    conexiones:
      - [P1, antena_tx.RF]
      - { entre: [antena_tx.RF, antena_rx.RF], tipo: radiado }
      - [antena_rx.RF, P2]
