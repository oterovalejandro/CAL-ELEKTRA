# Plantilla de ensayo por LISTA DE FRECUENCIAS: cables N en los puntos de
# calibración del laboratorio (CSV en «listas/»: 30 MHz – 1 GHz cada 10 MHz y
# 1 – 18 GHz cada 100 MHz). En el ZNB la lista se envía como barrido segmentado.
# Pasa / falla: |S21| dentro de ± 0,5 dB de la curva de referencia del tipo de
# cable (S2P en «especificaciones/»).
formato: calelektra/procedimiento@0.3
id: cable_N_lista
nombre: Cable N 2 m — puntos de calibración (lista CSV) con pasa / falla
version: "1.0"
estado: borrador
descripcion: >
  Medida de los parámetros S de un cable N en las frecuencias de una lista CSV
  y comparación de |S21| con la curva de referencia ± 0,5 dB.
algoritmo: vna_2_puertos
plantillas_compatibles: [cable_vna, componente_2p]
barrido:
  modo: lista
  fichero_lista: listas/puntos_cable_N.csv
  potencia_dbm: -10
  ifbw: 300 Hz
  promedios: 2
  suavizado_pct: 0
calibracion:
  metodo: automatico
verificacion:
  activa: true
  tolerancia_s21_db: 0.1
  s11_max_db: -30
especificaciones:
  - nombre: Atenuación frente a la referencia
    fichero: especificaciones/cable_N_2m_referencia.s2p
    parametros: [S21, S12]
    criterio: tolerancia    # |medida − referencia| ≤ tolerancia
    magnitud: magnitud_db
    tolerancia: 0.5
exportacion:
  formato: RI
  unidad_frecuencia: HZ
  nombre_fichero: "{dut}_{fecha}"
  csv: true
