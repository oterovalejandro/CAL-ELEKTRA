# Plantilla de ensayo (equivalente al «test template» de ELEKTRA): parámetros S
# de un cable o componente de 2 puertos con VNA, en el rango del hardware setup.
#   1. Calibración de los 2 puertos en los planos de referencia del setup
#      (TOSM si los planos se unen directamente; si no, UOSM).
#   2. Verificación de la calibración.
#   3. Medida de S11, S21, S12 y S22 del cable elegido en el ensayo.
#   4. Exportación a Touchstone (.s2p) y CSV.
# Sin «inicio»/«fin», el rango es el rango requerido del hardware setup.
formato: calelektra/procedimiento@0.3
id: cable_parametros_s
nombre: Parámetros S de cable (2 puertos) → .s2p
version: "1.1"
estado: borrador
descripcion: >
  Calibración de los dos puertos del VNA, medida de los cuatro parámetros S
  del cable en el rango requerido del hardware setup y exportación a .s2p.
algoritmo: vna_2_puertos
plantillas_compatibles: [cable_vna, componente_2p]
barrido:
  modo: lineal              # lineal | logaritmico | lista
  definicion: puntos        # lineal: puntos | paso
  puntos: 801
  potencia_dbm: -10
  ifbw: 1 kHz               # ajustes de todas las trazas
  promedios: 1
  suavizado_pct: 0
calibracion:
  metodo: automatico        # automatico | TOSM | UOSM | existente
  guardar_en_vna: false
  nombre_en_vna: "CALELEKTRA_{ensayo}"
verificacion:
  activa: true
  tolerancia_s21_db: 0.1    # through plano: |S21| ± 0,1 dB; UOSM: reciprocidad del through
  s11_max_db: -30           # reflexión residual de la carga adaptada
exportacion:
  formato: RI               # RI | MA | DB
  unidad_frecuencia: HZ
  nombre_fichero: "{dut}_{fecha}"
  csv: true
