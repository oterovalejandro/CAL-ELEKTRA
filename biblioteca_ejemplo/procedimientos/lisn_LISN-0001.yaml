# Plantilla de ensayo: impedancia en el terminal EUT de la LISN LISN-0001 con el
# hardware setup «Medida de impedancia — Reflexión en 1 puerto»
# (lisn_impedancia_VNA-BF: VNA de baja frecuencia; camino P1 = cable de medida N
# + adaptador N – terminales de la LISN). El setup da las frecuencias
# (9 kHz – 30 MHz, logarítmico, 201 puntos).
formato: calelektra/procedimiento@0.3
id: lisn_LISN-0001
nombre: Impedancia de la LISN LISN-0001 (terminal EUT) → .s1p
version: "1.0"
estado: borrador
descripcion: >
  Calibración OSM en el plano de referencia (terminales del adaptador),
  medida de la reflexión en el terminal EUT, impedancia y exportación a .s1p
  y CSV.
algoritmo: vna_1_puerto
hardware_setup: lisn_impedancia_VNA-BF
eut: LISN-0001
puertos_eut: [EUT]
barrido:
  potencia_dbm: -10
  ifbw: 100 Hz
  promedios: 1
  suavizado_pct: 0
calibracion:
  metodo: automatico
verificacion:
  activa: true
  s11_max_db: -35
exportacion:
  formato: MA
  unidad_frecuencia: HZ
  nombre_fichero: "{dut}_{fecha}"
  csv: true
