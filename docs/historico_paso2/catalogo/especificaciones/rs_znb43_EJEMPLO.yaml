# ─────────────────────────────────────────────────────────────────────────────
# FICHERO DE ESPECIFICACIONES / INCERTIDUMBRE (importable)
#
# ⚠⚠ TODOS LOS VALORES NUMÉRICOS DE ESTE FICHERO SON FICTICIOS ⚠⚠
# Solo ilustran el formato. Sustituirlos por los del datasheet, del
# certificado de calibración o de la caracterización propia del laboratorio.
# El importador rechazará para uso real cualquier fichero con
# estado: EJEMPLO_NO_USAR.
#
# Estructura de cada ítem:
#   magnitud      → término del vocabulario de la categoría (vna.yaml)
#   tipo          → limite_max | limite_min | tipico | incertidumbre
#   condiciones   → bajo qué condiciones aplica (kit, IFBW, potencia, T…)
#   valores       → constante | bandas | tabla | tabla_2d
#   distribucion  → para pasar a incertidumbre típica:
#                    rectangular (u = a/√3), normal (u = U/k), en_U (u = a/√2)
# BORRADOR v0.1
# ─────────────────────────────────────────────────────────────────────────────
formato: calmc/especificaciones@0.1
estado: EJEMPLO_NO_USAR

aplica_a:
  nivel: modelo                       # modelo (datasheet) | equipo (certificado / caracterización)
  categoria: vna
  fabricante: Rohde & Schwarz
  modelo: ZNB43

fuente:
  tipo: datasheet                     # datasheet | certificado | caracterizacion_propia
  documento: "R&S ZNB – Specifications"
  version: "A RELLENAR"
  fecha: null

condiciones_generales:
  temperatura: "23 °C ± 5 K"          # FICTICIO
  calentamiento: "≥ 30 min"           # FICTICIO

items:
  # ── Datos de sistema efectivos tras calibración TOSM con un kit dado ─────
  - magnitud: directividad_efectiva
    tipo: limite_min
    distribucion: rectangular
    condiciones: { calibracion: TOSM, kit: "kit 2.92 mm (indicar modelo)" }
    valores:
      bandas:
        - { f: [100 kHz, 2 GHz],    valor: 46 }
        - { f: [2 GHz, 20 GHz],     valor: 44 }
        - { f: [20 GHz, 43.5 GHz],  valor: 38 }

  - magnitud: adaptacion_fuente_efectiva
    tipo: limite_min
    distribucion: rectangular
    condiciones: { calibracion: TOSM, kit: "kit 2.92 mm (indicar modelo)" }
    valores:
      bandas:
        - { f: [100 kHz, 2 GHz],    valor: 40 }
        - { f: [2 GHz, 20 GHz],     valor: 38 }
        - { f: [20 GHz, 43.5 GHz],  valor: 33 }

  - magnitud: seguimiento_reflexion_efectivo
    tipo: limite_max
    distribucion: rectangular
    condiciones: { calibracion: TOSM, kit: "kit 2.92 mm (indicar modelo)" }
    valores:
      bandas:
        - { f: [100 kHz, 2 GHz],    valor: 0.04 }
        - { f: [2 GHz, 20 GHz],     valor: 0.06 }
        - { f: [20 GHz, 43.5 GHz],  valor: 0.10 }

  - magnitud: adaptacion_carga_efectiva
    tipo: limite_min
    distribucion: rectangular
    condiciones: { calibracion: TOSM, kit: "kit 2.92 mm (indicar modelo)" }
    valores:
      bandas:
        - { f: [100 kHz, 2 GHz],    valor: 46 }
        - { f: [2 GHz, 20 GHz],     valor: 44 }
        - { f: [20 GHz, 43.5 GHz],  valor: 38 }

  - magnitud: seguimiento_transmision_efectivo
    tipo: limite_max
    distribucion: rectangular
    condiciones: { calibracion: TOSM, kit: "kit 2.92 mm (indicar modelo)" }
    valores:
      bandas:
        - { f: [100 kHz, 2 GHz],    valor: 0.06 }
        - { f: [2 GHz, 20 GHz],     valor: 0.08 }
        - { f: [20 GHz, 43.5 GHz],  valor: 0.12 }

  # ── Receptor ─────────────────────────────────────────────────────────────
  - magnitud: ruido_traza_magnitud
    tipo: tipico
    distribucion: normal
    k: 1
    condiciones: { ifbw: 10 kHz, potencia: 0 dBm }
    valores:
      bandas:
        - { f: [100 kHz, 1 MHz],    valor: 0.010 }
        - { f: [1 MHz, 20 GHz],     valor: 0.004 }
        - { f: [20 GHz, 43.5 GHz],  valor: 0.008 }

  - magnitud: rango_dinamico
    tipo: limite_min
    condiciones: { ifbw: 10 Hz }
    valores:
      bandas:
        - { f: [100 kHz, 1 MHz],    valor: 100 }
        - { f: [1 MHz, 20 GHz],     valor: 130 }
        - { f: [20 GHz, 43.5 GHz],  valor: 115 }

  - magnitud: deriva_temperatura_magnitud
    tipo: tipico
    distribucion: rectangular
    valores: { constante: 0.01 }

  # ── Incertidumbre ya combinada, dependiente del nivel medido (opcional) ──
  # Útil si se digitalizan las curvas de incertidumbre del datasheet o si el
  # laboratorio la ha evaluado (p. ej. según EURAMET cg-12).
  - magnitud: incertidumbre_transmision_magnitud
    tipo: incertidumbre
    distribucion: normal
    k: 2
    condiciones: { calibracion: TOSM, ifbw: 10 Hz }
    valores:
      tabla_2d:
        frecuencia: [100 kHz, 2 GHz, 20 GHz, 43.5 GHz]
        nivel_S21_dB: [0, -20, -40, -60, -80, -100]
        datos:                 # filas = frecuencia, columnas = nivel_S21_dB
          - [0.10, 0.08, 0.08, 0.10, 0.25, 1.00]
          - [0.10, 0.08, 0.08, 0.10, 0.20, 0.80]
          - [0.15, 0.10, 0.10, 0.12, 0.30, 1.20]
          - [0.25, 0.18, 0.18, 0.25, 0.60, 2.00]
        interpolacion: { frecuencia: log, nivel_S21_dB: lineal }
