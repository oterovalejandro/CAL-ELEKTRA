[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cal-elektra"
version = "0.8.2"
description = "Software para laboratorio de calibración de equipos de MC: catálogo de equipos, hardware setups y control de VNA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.8",
    "pyqtgraph>=0.13.7",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "openpyxl>=3.1",  # condiciones ambientales: ficheros .xlsx de la sonda TPH
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Conexión con los VNA reales (VISA). Además hace falta un backend VISA: R&S VISA, NI-VISA o pyvisa-py.
instrumentos = ["pyvisa>=1.13"]

[project.gui-scripts]
cal-elektra = "calelektra.gui.app:main"

[project.scripts]
cal-elektra-vna = "calelektra.instruments.znx_debug.console:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
